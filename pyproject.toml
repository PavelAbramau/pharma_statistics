[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-stats"
version = "0.1.0"
description = "Detects silently-discontinued ADC oncology programs from public data."
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pharma_stats = ["discovery/seed_assets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
