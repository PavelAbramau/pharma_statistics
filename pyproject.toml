[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-stats"
version = "0.1.0"
description = "Detects silently-discontinued ADC oncology programs from public data."
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Ad hoc statistical EDA scripts only (e.g. scripts/eda_silence_features.py,
# scripts/build_eda_dashboard.py) — never a runtime dependency of the
# pipeline itself.
analysis = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.1", "lifelines>=0.28"]
# scripts/run_silver_labelling.py only — requires ANTHROPIC_API_KEY.
silver = ["anthropic>=0.125"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pharma_stats = ["discovery/seed_assets.json", "labelling/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
